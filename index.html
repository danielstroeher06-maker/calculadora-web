<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class= "historico" id="historico">
    <h3>Histórico</h3>
    <ul id="lista-historico"></ul>
</div>

<div id="calculadora">
    <div id="display">0</div>
    <div id="buttons">

            <button>%</button>
            <button>CE</button>
            <button class="btn-limpar">C</button>
            <button class="btn-apagar">←</button>

            <button>1/x</button>
            <button>x²</button>
            <button>√x</button>
            <button>/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>x</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>+/-</button>
            <button>0</button>
            <button>.</button>
            <button class="btn-igual">=</button>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
